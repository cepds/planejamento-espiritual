name: Atualizar conteúdo espiritual

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/content.json'
  schedule:
    - cron: '47 3,9,15,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-conteudo
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run update-content
      - name: Salvar conteúdo atualizado
        run: |
          git config user.name "Planejamento Espiritual"
          git config user.email "actions@github.com"
          git add data/content.json
          git diff --cached --quiet || git commit -m "Atualiza texto diário e reunião"
          git push
      - name: Publicar no Firebase
        run: npx firebase-tools deploy --only hosting --project planejamento-espiritual --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
