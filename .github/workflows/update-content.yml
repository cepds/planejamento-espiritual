name: Atualizar conteúdo espiritual

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/content.json'
  schedule:
    # Brasilia (UTC-3): atualização diária às 00:00, com novas tentativas
    # após a virada e pré-publicação do dia seguinte na noite anterior.
    # Horários do GitHub Actions são UTC e podem sofrer atrasos.
    - cron: '0 3 * * *'
    - cron: '10 3 * * *'
    - cron: '0 6,9,15,21,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-conteudo
  cancel-in-progress: true

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm run check
      - run: npm run update-content
      - name: Salvar conteúdo atualizado
        run: |
          git config user.name "Planejamento Espiritual"
          git config user.email "actions@github.com"
          git add data/content.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza texto diário e reunião"
            if ! git push; then
              echo "::warning::Publicação do conteúdo no GitHub não realizada porque outra atualização ocorreu em paralelo. O deploy seguirá; a próxima execução atualizará o conteúdo."
            fi
          fi
      # A conta de serviço é preferida; token antigo continua como contingência.
      - name: Preparar credenciais do Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            chmod 600 "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          fi
      - name: Garantir banco Firestore para eventos públicos
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase_cli() {
            if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
              npx --yes firebase-tools@15.34.1 "$@" --project planejamento-espiritual --non-interactive
            elif [ -n "$FIREBASE_TOKEN" ]; then
              npx --yes firebase-tools@15.34.1 "$@" --project planejamento-espiritual --token "$FIREBASE_TOKEN" --non-interactive
            else
              echo "::error::Credenciais Firebase indisponíveis."
              return 1
            fi
          }
          if firebase_cli firestore:databases:get "(default)" > /dev/null 2>&1; then
            echo "Firestore padrão já configurado."
          else
            echo "Tentando criar banco Firestore padrão na região de São Paulo."
            firebase_cli firestore:databases:create "(default)" --location=southamerica-east1
          fi
      - name: Publicar no Firebase
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          DEPLOY_TARGETS=hosting,firestore:rules
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            npx --yes firebase-tools@15.34.1 deploy --only "$DEPLOY_TARGETS" --project planejamento-espiritual --non-interactive
          elif [ -n "$FIREBASE_TOKEN" ]; then
            echo "::warning::Token legado em uso. Configure FIREBASE_SERVICE_ACCOUNT para migrar."
            npx --yes firebase-tools@15.34.1 deploy --only "$DEPLOY_TARGETS" --project planejamento-espiritual --token "$FIREBASE_TOKEN" --non-interactive
          else
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT ou FIREBASE_TOKEN."
            exit 1
          fi
